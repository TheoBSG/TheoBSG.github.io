<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#003262">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Berkeley">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TOEFL App</title>
<style>
:root { --bg: #f4f6f9; --card: #ffffff; --ink: #0e1b2c; --muted: #5b6b7f; --line: #d9e0e8; --blue: #003262; --gold: #fdb515; --err: #b42318; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1422; --card: #13213a; --ink: #e8eef6; --muted: #9fb0c4; --line: #26385a; --err: #ff8a80; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
.lock { flex: 0 1 340px; min-width: 0; max-width: 340px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px 22px; text-align: center; box-shadow: 0 10px 30px rgba(14, 27, 44, .08); }
.mark { width: 56px; height: 56px; border-radius: 14px; background: var(--blue); color: var(--gold); display: grid; place-items: center; font-weight: 800; font-size: 24px; margin: 0 auto 14px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input { margin: 18px 0 12px; width: 100%; min-width: 0; font: 600 26px/1 ui-monospace, Consolas, monospace; letter-spacing: .5em; text-align: center; padding: 12px 8px 12px calc(8px + .5em); border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
input:focus { outline: 3px solid var(--gold); outline-offset: 1px; }
button { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font: 600 16px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: pointer; }
button:hover { filter: brightness(1.12); }
button:disabled { opacity: .6; cursor: progress; }
#msg { min-height: 1.4em; margin-top: 12px; }
#msg.err { color: var(--err); }
</style>
</head>
<body>
<main class="lock" id="lock" hidden>
  <div class="mark" aria-hidden="true">B</div>
  <h1>Road to Berkeley</h1>
  <p>Enter your PIN</p>
  <form id="form" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="12" required aria-label="PIN">
    <button id="go" type="submit">Unlock</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
</main>
<noscript>This app needs JavaScript.</noscript>
<script>
// Generated by tools/publish.py: the page itself is encrypted (AES-256-GCM, key = PBKDF2-SHA256 of the PIN).
(function () {
  "use strict";
  var CFG = {"salt": "CsmbHsPb2EHM3eXnoRx1UQ==", "iterations": 600000, "file": "speaking.bin"};
  var STORE = "rtb.unlock"; // derived key for this tab only: other pages open without asking again

  function fromB64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(a) { var s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function remember(raw) { try { sessionStorage.setItem(STORE, toB64(raw)); } catch (e) { /* private mode: ask again next page */ } }
  function recall() { try { var v = sessionStorage.getItem(STORE); return v ? fromB64(v) : null; } catch (e) { return null; } }
  function forget() { try { sessionStorage.removeItem(STORE); } catch (e) { /* nothing stored */ } }

  async function derive(pin) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: fromB64(CFG.salt), iterations: CFG.iterations }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw) {
    var res = await fetch(CFG.file, { cache: "no-cache" });
    if (!res.ok) throw new TypeError("HTTP " + res.status);
    var buf = new Uint8Array(await res.arrayBuffer());
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, key, buf.subarray(12));
    return new TextDecoder().decode(plain);
  }
  function render(html) {
    document.open(); document.write(html); document.close();
    // The page's own "load" listener may never fire after document.write: register the offline cache here too.
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  var lock = document.getElementById("lock"), form = document.getElementById("form");
  var pin = document.getElementById("pin"), go = document.getElementById("go"), msg = document.getElementById("msg");
  function ask(text, isErr) {
    lock.hidden = false; go.disabled = false;
    msg.textContent = text || ""; msg.className = isErr ? "err" : "";
    pin.value = ""; pin.focus();
  }

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (!/^\d{4,12}$/.test(pin.value)) { ask("Digits only, at least 4.", true); return; }
    go.disabled = true; msg.className = ""; msg.textContent = "Unlocking…";
    var raw, html;
    try { raw = await derive(pin.value); } catch (e) { ask("This browser can't unlock the app.", true); return; }
    try { html = await decrypt(raw); } catch (e) {
      ask(e && e.name === "OperationError" ? "Wrong PIN." : "Can't load the app: check your connection.", true);
      return;
    }
    remember(raw);
    render(html);
  });

  (async function start() {
    if (!window.crypto || !crypto.subtle) { ask("Open this page over https.", true); return; }
    var raw = recall();
    if (raw) {
      try { render(await decrypt(raw)); return; } catch (e) { forget(); }
    }
    ask("");
  })();
})();
</script>
</body>
</html>
